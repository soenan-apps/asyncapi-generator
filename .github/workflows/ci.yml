name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift 6.3.3 / Node 24.11.1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: swift:6.3.3-bookworm@sha256:eefe3757e5e9b760628212943c3b5c7c7e3e7e5b9cf549bedb547689e6ef0b4c

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: 2026.7.13
          sha256: 47878bc295922c5f7ba4b7054cc372ce6ae730a1f12b0753c1cda2f04376eee2

      - name: Verify Swift version
        run: swift --version | grep -F "Swift version 6.3.3"

      - name: Verify Node version
        run: test "$(node --version)" = "v24.11.1"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Verify dependency manifests are unchanged
        run: git diff --exit-code -- package.json package-lock.json
